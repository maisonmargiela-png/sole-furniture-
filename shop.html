<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop – Sole Furniture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="logo" href="index.html">Sole Furniture</a>
  <nav>
    <a href="index.html#about">About</a>
    <a href="#contact">Contact</a>
    <button id="basket-btn" onclick="openBasket()">Basket (<span class="basket-count">0</span>)</button>
  </nav>
</header>
<div class="catbar" id="catbar"></div>
<main>
  <section>
    <h2 id="page-title">All products</h2>
    <div class="grid" id="products"></div>
  </section>
</main>
<footer id="contact">
  <p style="margin-bottom:12px">Questions? Email <a href="mailto:solejug@gmail.com">solejug@gmail.com</a></p>
  <a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><a href="cookies.html">Cookies</a>
</footer>
<script src="products.js"></script>
<script src="cart.js"></script>
<script>
const wanted = new URLSearchParams(location.search).get("c");
const cat = categories.find(c => c.id === wanted);
document.getElementById("page-title").textContent = cat ? cat.name : "All products";
renderCategoryBar(cat ? cat.id : null);
renderProducts("products", cat ? products.filter(p => p.category.includes(cat.id)) : products);
</script>
</body>
</html>
