<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop, page 2 – Sole Furniture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0EC;--ink:#1F2A24;--moss:#2F4A3A;--oak:#B8864B;--stone:#D9DDD5;--white:#FBFCFA}
*{box-sizing:border-box;margin:0}
body{font-family:"Instrument Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
a{color:inherit}
:focus-visible{outline:3px solid var(--oak);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 5vw;background:var(--white);border-bottom:1px solid var(--stone)}
.logo{font-family:"Young Serif",serif;font-size:1.4rem;text-decoration:none}
nav a{margin-left:20px;text-decoration:none;font-weight:500}
nav a:hover{color:var(--oak)}
section{padding:64px 5vw}
h2{font-family:"Young Serif",serif;font-weight:400;font-size:2rem;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px}
.card{background:var(--white);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.photo{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:var(--white);font-size:.9rem}
.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:18px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:1.1rem;font-weight:600}
.info p{font-size:.95rem;color:#4b574f}
.price{font-weight:600;font-size:1.15rem;margin-top:auto;padding-top:10px}
.buy{margin-top:10px;text-align:center;background:var(--ink);color:var(--white);padding:11px;border-radius:4px;text-decoration:none;font-weight:500}
.buy:hover{background:var(--moss)}
.pager{display:flex;gap:12px;margin-top:36px}
.pager a{padding:10px 18px;background:var(--white);border-radius:4px;text-decoration:none;font-weight:500}
.pager a[aria-current]{background:var(--ink);color:var(--white)}
footer{padding:36px 5vw;background:var(--ink);color:var(--stone);font-size:.95rem}
footer a{margin-right:18px}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">Sole Furniture</a>
  <nav>
    <a href="shop.html">Shop</a>
    <a href="index.html#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>
<main>
  <section>
    <h2>All products (page 2 of 2)</h2>
    <div class="grid" id="products"></div>
    <div class="pager">
      <a href="shop.html">Page 1</a>
      <a href="shop2.html" aria-current="page">Page 2</a>
    </div>
  </section>
</main>
<footer id="contact">
  <p style="margin-bottom:12px">Questions? Email <a href="mailto:solejug@gmail.com">solejug@gmail.com</a></p>
  <a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><a href="cookies.html">Cookies</a>
</footer>
<script src="products.js"></script>
<script>renderProducts("products", 5, 10);</script>
</body>
</html>
